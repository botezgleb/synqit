version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synqit-backend
    network_mode: "host"
    ports:
      - "3000:3000"
    environment:
      - CLIENT_URL=http://localhost:5173
      - SERVER_PORT=3000
      - AI_API_KEY=${AI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: synqit-frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    depends_on:
      - server
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: synqit_postgres
    restart: always
    environment:
      POSTGRES_USER: synqit
      POSTGRES_PASSWORD: synqit_password
      POSTGRES_DB: synqit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: