# Все настройки (ключи API, логин/пароль БД, JWT) берутся из server/.env.
# Запуск: docker compose up --build
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synqit-backend
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./server/.env
    environment:
      # Значения ниже перекрывают server/.env — внутри docker сети БД доступна по имени сервиса.
      - DB_HOST=postgres
      - DB_PORT=5432
      - CLIENT_URL=http://localhost:5173
      - SERVER_PORT=3000
      # Прокси необязателен. Если нужен — запусти так:
      #   HTTP_PROXY=http://host.docker.internal:2080 HTTPS_PROXY=http://host.docker.internal:2080 docker compose up
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=localhost,127.0.0.1,postgres,synqit-frontend
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synqit-frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    depends_on:
      - server
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: synqit_postgres
    restart: always
    env_file:
      - ./server/.env
    # Образ postgres ждёт POSTGRES_*, а в server/.env они называются DB_* — пробрасываем.
    entrypoint:
      - sh
      - -c
      - |
        export POSTGRES_USER="$$DB_USER" POSTGRES_PASSWORD="$$DB_PASSWORD" POSTGRES_DB="$$DB_NAME"
        exec docker-entrypoint.sh postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
