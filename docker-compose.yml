version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synqit-backend
    network_mode: "host"
    ports:
      - "3000:3000"
    environment:
      - CLIENT_URL=${CLIENT_URL}
      - SERVER_PORT=${SERVER_PORT}
      - AI_API_KEY=${AI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=localhost
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=${POSTGRES_PORT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
    container_name: synqit-frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    depends_on:
      - server
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: synqit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: