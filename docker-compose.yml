services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synqit-backend
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HTTP_PROXY=http://host.docker.internal:2080
      - HTTPS_PROXY=http://host.docker.internal:2080
      - NO_PROXY=localhost,127.0.0.1,postgres,synqit-frontend
      - CLIENT_URL=http://localhost:5173
      - SERVER_PORT=3000
      - AI_API_KEY=${AI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synqit-frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
    depends_on:
      - server
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: synqit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: